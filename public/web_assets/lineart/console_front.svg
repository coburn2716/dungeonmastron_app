<svg xmlns="http://www.w3.org/2000/svg" viewBox="-24 -392 248 464" role="img" aria-label="Front elevation technical drawing of the Dungeon Mastron console">
<style>
  .note { font: 500 9px ui-monospace, "JetBrains Mono", Menlo, Consolas, monospace; letter-spacing: .14em; fill: #ECE6DA; fill-opacity: .55; }
  .note.title { fill-opacity: .40; letter-spacing: .18em; }
  .keycap { font: 600 7px ui-monospace, "JetBrains Mono", Menlo, Consolas, monospace; fill: #ECE6DA; fill-opacity: .60; }
  .lead { stroke: #ECE6DA; stroke-opacity: .30; stroke-width: .7; fill: none; }
  .ext, .dim { stroke: #ECE6DA; stroke-opacity: .25; stroke-width: .7; fill: none; }
  .arr { fill: #ECE6DA; fill-opacity: .35; }
  .led { opacity: .35; animation: ledPulse 5.4s ease-in-out infinite; }
  .led-0 { animation-delay: 0s; } .led-1 { animation-delay: 1.35s; }
  .led-2 { animation-delay: 2.7s; } .led-3 { animation-delay: 4.05s; }
  .ledB.led-0 { animation-delay: .7s; } .ledB.led-1 { animation-delay: 2.05s; }
  .ledB.led-2 { animation-delay: 3.4s; } .ledB.led-3 { animation-delay: 4.75s; }
  @keyframes ledPulse { 0%,100% { opacity: .3; } 50% { opacity: 1; } }
  .cursor { animation: curBlink 1.3s steps(1) infinite; }
  @keyframes curBlink { 0%,55% { opacity: 1; } 56%,100% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; }
    .shine { opacity: 0; } .led { opacity: .75; }
  }

  .shine { stroke-dasharray: 4 96; opacity: 0; animation: feShine 10s linear infinite; animation-delay: -2s; }
  .shine2 { stroke-dasharray: 1.6 98.4; animation-delay: -1.94s; }
  @keyframes feShine {
    0% { stroke-dashoffset: 100; opacity: 0; }
    4% { opacity: .9; } 46% { opacity: .9; }
    50% { stroke-dashoffset: 0; opacity: 0; }
    100% { stroke-dashoffset: 0; opacity: 0; }
  }
  .mark { animation: markBreath 6s ease-in-out infinite; }
  @keyframes markBreath { 0%,100% { stroke-opacity: .5; } 50% { stroke-opacity: 1; } }</style>
