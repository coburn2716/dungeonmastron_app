<svg xmlns="http://www.w3.org/2000/svg" viewBox="-6 0 442 612" role="img" aria-label="Technical line drawing of the Dungeon Mastron web player interface">
<style>
  .note { font: 500 9px ui-monospace, "JetBrains Mono", Menlo, Consolas, monospace; letter-spacing: .14em; fill: #ECE6DA; fill-opacity: .55; }
  .note.title { fill-opacity: .40; letter-spacing: .18em; }
  .keycap { font: 600 10px ui-monospace, "JetBrains Mono", Menlo, Consolas, monospace; fill: #ECE6DA; fill-opacity: .65; }
  .chip { font: 500 9px ui-monospace, "JetBrains Mono", Menlo, Consolas, monospace; fill: #E2683C; fill-opacity: .8; }
  .stats { font: 500 8px ui-monospace, "JetBrains Mono", Menlo, Consolas, monospace; letter-spacing: .12em; fill: #ECE6DA; fill-opacity: .30; }
  .lead { stroke: #ECE6DA; stroke-opacity: .30; stroke-width: .7; fill: none; }
  .ext, .dim { stroke: #ECE6DA; stroke-opacity: .25; stroke-width: .7; fill: none; }
  .arr { fill: #ECE6DA; fill-opacity: .35; }
  .shine { stroke-dasharray: 4 96; opacity: 0; animation: wpShine 9s linear infinite; animation-delay: -3s; }
  .shine2 { stroke-dasharray: 1.6 98.4; animation-delay: -2.94s; }
  @keyframes wpShine {
    0% { stroke-dashoffset: 100; opacity: 0; }
    4% { opacity: .9; }
    46% { opacity: .9; }
    50% { stroke-dashoffset: 0; opacity: 0; }
    100% { stroke-dashoffset: 0; opacity: 0; }
  }
  .led { opacity: .35; animation: ledPulse 5.6s ease-in-out infinite; }
  .led-0 { animation-delay: .4s; } .led-1 { animation-delay: 1.8s; }
  .led-2 { animation-delay: 3.2s; } .led-3 { animation-delay: 4.6s; }
  .ledB.led-0 { animation-delay: 1.1s; } .ledB.led-1 { animation-delay: 2.5s; }
  .ledB.led-2 { animation-delay: 3.9s; } .ledB.led-3 { animation-delay: 5.3s; }
  @keyframes ledPulse { 0%,100% { opacity: .3; } 50% { opacity: 1; } }
  .cursor { animation: curBlink 1.3s steps(1) infinite; animation-delay: -.5s; }
  @keyframes curBlink { 0%,55% { opacity: 1; } 56%,100% { opacity: 0; } }
  .scan { animation: scanDrift 8s linear infinite; animation-delay: -2s; }
  @keyframes scanDrift { from { transform: translateY(0); } to { transform: translateY(-356px); } }
  @media (prefers-reduced-motion: reduce) {
    .shine, .shine2, .led, .cursor, .scan { animation: none !important; }
    .shine, .shine2 { opacity: 0; } .led { opacity: .75; }
  }
</style>
