<svg xmlns="http://www.w3.org/2000/svg" viewBox="-150 -478 560 528" role="img" aria-label="Technical line drawing of the Dungeon Mastron console with a cartridge inserted">
<style>
  .note { font: 500 9px ui-monospace, "JetBrains Mono", Menlo, Consolas, monospace; letter-spacing: .14em; fill: #ECE6DA; fill-opacity: .55; }
  .note.title { fill-opacity: .40; letter-spacing: .18em; }
  .keycap { font: 600 9px ui-monospace, "JetBrains Mono", Menlo, Consolas, monospace; fill: #ECE6DA; fill-opacity: .65; }
  .lead { stroke: #ECE6DA; stroke-opacity: .30; stroke-width: .7; fill: none; }
  .ext, .dim { stroke: #ECE6DA; stroke-opacity: .25; stroke-width: .7; fill: none; }
  .arr { fill: #ECE6DA; fill-opacity: .35; }
  .shine { stroke-dasharray: 4 96; stroke-dashoffset: 0; opacity: 0; animation: consoleShine 11s linear infinite; }
  .shine2 { stroke-dasharray: 1.6 98.4; animation-delay: .06s; }
  @keyframes consoleShine {
    0% { stroke-dashoffset: 100; opacity: 0; }
    4% { opacity: .9; }
    46% { opacity: .9; }
    50% { stroke-dashoffset: 0; opacity: 0; }
    100% { stroke-dashoffset: 0; opacity: 0; }
  }
  .led { opacity: .35; animation: ledPulse 5.2s ease-in-out infinite; }
  .led-0 { animation-delay: 0s; } .led-1 { animation-delay: 1.3s; }
  .led-2 { animation-delay: 2.6s; } .led-3 { animation-delay: 3.9s; }
  .ledB.led-0 { animation-delay: .65s; } .ledB.led-1 { animation-delay: 1.95s; }
  .ledB.led-2 { animation-delay: 3.25s; } .ledB.led-3 { animation-delay: 4.55s; }
  @keyframes ledPulse { 0%,100% { opacity: .3; } 50% { opacity: 1; } }
  .cursor { animation: curBlink 1.3s steps(1) infinite; }
  @keyframes curBlink { 0%,55% { opacity: 1; } 56%,100% { opacity: 0; } }
  .scan { animation: scanDrift 7s linear infinite; }
  @keyframes scanDrift { from { transform: translateY(0); } to { transform: translateY(-168px); } }
  .mark { animation: markBreath 6s ease-in-out infinite; }
  @keyframes markBreath { 0%,100% { stroke-opacity: .5; } 50% { stroke-opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .shine, .shine2, .led, .cursor, .scan, .mark { animation: none !important; }
    .shine, .shine2 { opacity: 0; } .led { opacity: .75; }
  }
</style>
