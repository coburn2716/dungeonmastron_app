<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 452 490" role="img" aria-label="Technical line drawing of a blank Dungeon Mastron game cartridge, label area waiting for a title">
<style>
  .note { font: 500 9px ui-monospace, "JetBrains Mono", Menlo, Consolas, monospace; letter-spacing: .14em; fill: #17150F; fill-opacity: .55; }
  .note.title { fill-opacity: .42; letter-spacing: .18em; }
  .lead { stroke: #17150F; stroke-opacity: .32; stroke-width: .7; fill: none; }
  .ext, .dim { stroke: #17150F; stroke-opacity: .28; stroke-width: .7; fill: none; }
  .arr { fill: #17150F; fill-opacity: .38; }
  .shine { stroke-dasharray: 4 96; opacity: 0; animation: cartShine 13s linear infinite; animation-delay: -6s; }
  @keyframes cartShine {
    0% { stroke-dashoffset: 100; opacity: 0; }
    4% { opacity: .8; }
    40% { opacity: .8; }
    44% { stroke-dashoffset: 0; opacity: 0; }
    100% { stroke-dashoffset: 0; opacity: 0; }
  }
  .mark { animation: markBreath 7s ease-in-out infinite; }
  @keyframes markBreath { 0%,100% { stroke-opacity: .55; } 50% { stroke-opacity: 1; } }
  .cursor { animation: curBlink 1.4s steps(1) infinite; }
  @keyframes curBlink { 0%,55% { opacity: 1; } 56%,100% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    .shine, .mark, .cursor { animation: none !important; }
    .shine { opacity: 0; }
  }
</style>
  <!-- centreline -->
  <path d="M200,34 V444" stroke="#17150F" stroke-opacity=".14" stroke-width=".7" stroke-dasharray="5 5" fill="none"/>
  <!-- cartridge body: near-square landscape slab, rounded corners -->
  <path d="M76,92 h248 a16,16 0 0 1 16,16 v208 a16,16 0 0 1 -16,16 h-248 a16,16 0 0 1 -16,-16 v-208 a16,16 0 0 1 16,-16 Z" stroke="#17150F" stroke-opacity=".80" stroke-width="1.5" fill="none"/>
  <rect x="65" y="97" width="270" height="230" rx="11" stroke="#17150F" stroke-opacity=".22" stroke-width=".8" fill="none"/>
  <path class="shine" d="M76,92 h248 a16,16 0 0 1 16,16 v208 a16,16 0 0 1 -16,16 h-248 a16,16 0 0 1 -16,-16 v-208 a16,16 0 0 1 16,-16 Z" pathLength="100" stroke="#C4552E" stroke-width="1.6" fill="none"/>
  <!-- grip grooves, both side edges near the top corners -->
  <path d="M64,116 h22 M64,128 h22 M64,140 h22 M64,152 h22" stroke="#17150F" stroke-opacity=".45" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <path d="M336,116 h-22 M336,128 h-22 M336,140 h-22 M336,152 h-22" stroke="#17150F" stroke-opacity=".45" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <!-- recessed label panel, upper two-thirds -->
  <rect x="100" y="114" width="200" height="134" rx="7" stroke="#17150F" stroke-opacity=".60" stroke-width="1.1" fill="none"/>
  <rect x="104" y="118" width="192" height="126" rx="5" stroke="#17150F" stroke-opacity=".20" stroke-width=".8" fill="none"/>
  <path class="mark" d="M200,150 L211,164 L200,178 L189,164 Z" stroke="#C4552E" stroke-width="1.2" fill="none"/>
  <path d="M200,158 L204.6,164 L200,170 L195.4,164 Z" stroke="#C4552E" stroke-opacity=".5" stroke-width=".8" fill="none"/>
  <path d="M112,134 v-9 h9 M279,125 h9 v9 M112,228 v9 h9 M279,237 h9 v-9" stroke="#17150F" stroke-opacity=".30" stroke-width="1" fill="none"/>
  <path d="M144,206 h112" stroke="#17150F" stroke-opacity=".38" stroke-width="1" fill="none"/>
  <path d="M168,220 h58" stroke="#17150F" stroke-opacity=".24" stroke-width="1" fill="none"/>
  <path class="cursor" d="M230,220 h7" stroke="#C4552E" stroke-width="2.4" fill="none"/>
  <!-- USB drive mounted inside, bottom centre (hidden - dashed) -->
  <path d="M186,272 h28 a5,5 0 0 1 5,5 v27 h-38 v-27 a5,5 0 0 1 5,-5 Z" stroke="#17150F" stroke-opacity=".40" stroke-width="1" stroke-dasharray="4 3" fill="none"/>
  <rect x="188" y="304" width="24" height="19" stroke="#17150F" stroke-opacity=".40" stroke-width="1" stroke-dasharray="4 3" fill="none"/>
  <path d="M194,309 v6 M206,309 v6" stroke="#17150F" stroke-opacity=".28" stroke-width="1" fill="none"/>
  <!-- annotations -->
  <path d="M34,82 L52,98 L62,114" class="lead"/>
  <text x="24" y="72" class="note">GRIP GROOVES ×4</text>
  <path d="M348,170 L320,176 L302,180" class="lead"/>
  <text x="344" y="166" class="note">LABEL — YOURS</text>
  <path d="M26,420 L112,388 L182,306" class="lead"/>
  <text x="24" y="432" class="note">USB DRIVE · MOUNTED INSIDE</text>
  <path d="M60,88 V56 M340,88 V56" class="ext"/>
  <path d="M60,62 H340" class="dim"/>
  <path d="M60,62 l6,-2.4 v4.8 Z M340,62 l-6,-2.4 v4.8 Z" class="arr"/>
  <text x="200" y="56" text-anchor="middle" class="note">ONE STORY PER CART</text>
  <text x="24" y="458" class="note title">DM·K1 — GAME CARTRIDGE · WRITE ONCE, PLAY FOREVER</text>
</svg>