  <path d="M90,-66 h44" class="ext"/>
  <text x="130" y="-82" class="note">69.5°</text>
  <path d="M0,6 V32 M210,6 V32" class="ext"/>
  <path d="M0,26 H210" class="dim"/>
  <path d="M0,26 l6,-2.4 v4.8 Z M210,26 l-6,-2.4 v4.8 Z" class="arr"/>
  <text x="105" y="40" text-anchor="middle" class="note">210 MM</text>
  <text x="-4" y="64" class="note title">DM·C1 — SIDE ELEVATION</text>
</svg>