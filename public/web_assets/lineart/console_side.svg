  <path class="shine shine2" d="M0,0 L0,-58 L90,-66 L170,-280 L210,-280 L210,0 Z" pathLength="100" stroke="#FFF6EC" stroke-width="1" fill="none"/>
  <path d="M180,-280 V-361 Q180,-364 183,-364 H191 Q194,-364 194,-361 V-280" stroke="#ECE6DA" stroke-opacity=".70" stroke-width="1.2" fill="none"/>
  <path d="M176,-280 V-246 H198 V-280" stroke="#ECE6DA" stroke-opacity=".28" stroke-width=".9" stroke-dasharray="4 3" fill="none"/>
  <path d="M95.4,-88.4 L156.2,-251" stroke="#ECE6DA" stroke-opacity=".50" stroke-width="1" fill="none"/>
  <path class="led led-0" d="M138.2,-207.8 l-3.4,1.3" stroke="#B85C4E" stroke-width="1.6" fill="none"/>
  <path class="led led-1" d="M129.8,-185.3 l-3.4,1.3" stroke="#E8A356" stroke-width="1.6" fill="none"/>
  <path class="led led-2" d="M121.4,-162.8 l-3.4,1.3" stroke="#7B93A8" stroke-width="1.6" fill="none"/>
  <path class="led led-3" d="M113,-140.4 l-3.4,1.3" stroke="#6B9B7F" stroke-width="1.6" fill="none"/>
  <path d="M24,-60.1 V-70.1 Q24,-72.1 27,-72.1 L55,-75.2 Q58,-75.2 58,-73.2 V-63.2" stroke="#ECE6DA" stroke-opacity=".55" stroke-width="1" fill="none"/>
  <path d="M26,-70.3 L56,-73" stroke="#ECE6DA" stroke-opacity=".25" stroke-width=".9" stroke-dasharray="3 3" fill="none"/>
